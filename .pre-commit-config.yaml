# See https://pre-commit.com for more information
# Hooks are executed by lefthook (see lefthook.yml), which calls `pre-commit run --hook-stage ...`.

default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
  - repo: local
    hooks:
      - id: lint
        name: make lint
        entry: make lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      - id: tests
        name: run unit tests
        entry: make test
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
      - id: integration-tests
        name: run integration tests
        entry: make integration_test
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
